# Local preview in Docker: `docker compose up`, then open http://localhost:4321/brightforge-plugins/
services:
  docs:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npx astro dev --host 0.0.0.0"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
